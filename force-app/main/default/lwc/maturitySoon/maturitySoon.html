<template>
    <lightning-card>
        <h3 slot="title">
            <lightning-icon icon-name="utility:connected_apps" size="small"></lightning-icon>
            Matured Soon ({recent.length})
        </h3>
        <p class="slds-p-horizontal_small">
            <template if:true={recent}>
                <div class="maturity-table-wrapper">
                    <div class="table-header">
                        <div class="table-row">
                            <div class="table-cell bold">A/C No.</div>
                            <div class="table-cell bold">Bank</div>
                            <div class="table-cell bold">Maturity Date</div>
                        </div>
                    </div>
                    <div class="table-body">
                        <template for:each={recent} for:item="recent">
                            <div key={recent.Id} class={recent.class}>
                                <div class="table-row">
                                    <div class="table-cell" title={recent.Account_Number__c}>
                                        <a href={recent.recordURL} target="_blank">
                                            {recent.Account_Number__c}
                                        </a>
                                    </div>
                                    <div class="table-cell" title={recent.Bank__c}>{recent.Bank__c}</div>
                                    <div class="table-cell" title={recent.Maturity_Date__c}>{recent.Maturity_Date__c}</div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
            <template if:true={norecord}>
                <span style="color: red;">No record to display</span>
            </template>
        </p>
    </lightning-card>
</template>
