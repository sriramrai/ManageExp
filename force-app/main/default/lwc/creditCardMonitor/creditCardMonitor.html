<template>
    <lightning-card>
        <div class="slds-align_absolute-center">
            <lightning-layout horizontal-align="center" style="width: 100%;">
                <lightning-layout-item style="padding: 5px; padding-right: 15px;" size="3">
                    <lightning-combobox
                        name="month"
                        label="Month"
                        value={selectedMonth}
                        options={months}
                        variant="label-hidden"
                        onchange={optionChangeHandler}>
                    </lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item style="padding: 5px; padding-right: 15px;" size="3">
                    <lightning-combobox
                        name="Year"
                        label="Year"
                        value={selectedYear}
                        options={years}
                        variant="label-hidden"
                        onchange={optionChangeHandler}>
                    </lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item style="padding-top: 5px;" size="2">
                    <lightning-button brand="submit" onclick={fetchData} label="Go"></lightning-button>
                </lightning-layout-item>
            </lightning-layout>
        </div>
        
        <div class="table-container">
            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered slds-table_striped slds-max-medium-table_stacked-horizontal">
                <thead>
                    <tr>
                        <th>CC Card</th>
                        <th>Amount</th>
                        <th>Purchased</th>
                        <th>Due Date</th>
                        <th>Details</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={currentMonthDue} for:item="record">
                        <tr key={record.Id}>
                            <td>{record.bank}</td>
                            <td>{record.amount}</td>
                            <td>{record.purchasedDate}</td>
                            <td>{record.dueDate}</td>
                            <td style="word-wrap: auto;">{record.details}</td>
                            <td>
                                <span if:false={record.isSettled}><a href="javascript:void(0)" onclick={settleHander} data-id={record.recordId}>Settle</a></span>
                                <span if:true={record.isSettled}><a href="javascript:void(0)" style="pointer-events: none;">Paid</a></span>
                            </td>
                        </tr>
                    </template>
                    <template if:true={displayUpcomingRow}>
                        <tr>
                            <td colspan="6"><strong>Upcoming month expenses</strong></td>
                        </tr>
                    </template>
                    <template for:each={nextMonthDue} for:item="record">
                        
                        <tr key={record.Id}>
                            <td>{record.bank}</td>
                            <td>{record.amount}</td>
                            <td>{record.purchasedDate}</td>
                            <td>{record.dueDate}</td>
                            <td style="word-wrap: auto;">{record.details}</td>
                            <td>
                                <span if:false={record.isSettled}><a href="javascript:void(0)" onclick={settleHander} data-id={record.recordId}>Settle</a></span>
                                <span if:true={record.isSettled}><a href="javascript:void(0)" style="pointer-events: none;">Paid</a></span>
                            </td>
                        </tr>
                    </template>
                </tbody>
                <tfoot if:true={currentMonthTotal}>
                    <tr>
                        <td colspan="4">ICICI CC</td>
                        <td class="total-value">
                            <lightning-formatted-number 
                                value={currentMonthTotal.ICICI}
                                format-style="currency"
                                currency-code="INR"
                                maximum-fraction-digits="0"
                            ></lightning-formatted-number>
                        </td>
                        <td class="total-value">
                            <lightning-formatted-number 
                                value={nextMonthTotal.ICICI}
                                format-style="currency"
                                currency-code="INR"
                                maximum-fraction-digits="0"
                            ></lightning-formatted-number>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4">AXIS CC</td>
                        <td class="total-value">
                            <lightning-formatted-number 
                                value={currentMonthTotal.AXIS}
                                format-style="currency"
                                currency-code="INR"
                                maximum-fraction-digits="0"
                            ></lightning-formatted-number>
                        </td>
                        <td class="total-value">
                            <lightning-formatted-number 
                                value={nextMonthTotal.AXIS}
                                format-style="currency"
                                currency-code="INR"
                                maximum-fraction-digits="0"
                            ></lightning-formatted-number>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4">Total:</td>
                        <td class="total-value">
                            <lightning-formatted-number 
                                value={currentMonthTotal.Total}
                                format-style="currency"
                                currency-code="INR"
                                maximum-fraction-digits="0"
                            ></lightning-formatted-number>
                        </td>
                        <td class="total-value">
                            <lightning-formatted-number 
                                value={nextMonthTotal.Total}
                                format-style="currency"
                                currency-code="INR"
                                maximum-fraction-digits="0"
                            ></lightning-formatted-number>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </lightning-card>
</template>
