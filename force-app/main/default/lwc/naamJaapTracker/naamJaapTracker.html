<template>
    <lightning-card title="Naam Jaap Tracker" icon-name="standard:record">
        <div class="slds-p-around_medium">
            <!-- Filter Section -->
            <div class="filter-section slds-m-bottom_medium">
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                        <lightning-combobox
                            name="month"
                            label="Month"
                            value={selectedMonth}
                            options={monthOptions}
                            onchange={handleMonthChange}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                        <lightning-combobox
                            name="year"
                            label="Year"
                            value={selectedYear}
                            options={yearOptions}
                            onchange={handleYearChange}>
                        </lightning-combobox>
                    </div>
                </div>
            </div>

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </template>

            <template if:false={isLoading}>
                <template if:true={error}>
                    <div class="slds-box slds-theme_alert-texture slds-theme_alert-default">
                        <p>Error loading data: {error.body.message}</p>
                    </div>
                </template>

                <template if:false={error}>
                    <template if:true={naamJaapList}>
                        <div class="table-container">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                                <thead>
                                    <tr class="slds-line-height_reset header-row">
                                        <th scope="col" class="slds-text-heading_label">
                                            <div class="slds-truncate">Date</div>
                                        </th>
                                        <th scope="col" class="slds-text-heading_label">
                                            <div class="slds-truncate">Entity</div>
                                        </th>
                                        <th scope="col" class="slds-text-heading_label">
                                            <div class="slds-truncate">Count</div>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={naamJaapList} for:item="item">
                                        <tr key={item.recordId} class="slds-line-height_reset">
                                            <td data-label="Date" scope="row">
                                                <a href={item.recordUrl} class="slds-truncate date-link">{item.formattedDate}</a>
                                            </td>
                                            <td data-label="Entity" scope="row">
                                                <div class="slds-truncate">{item.entity}</div>
                                            </td>
                                            <td data-label="Count" scope="row">
                                                <div class="slds-truncate">{item.count}</div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>

                        <div class="footer-section slds-p-around_small">
                            <h3 class="slds-text-heading_small slds-p-bottom_small">Total Count by Entity</h3>
                            <template if:true={entityTotalsArray}>
                                <table class="slds-table slds-table_cell-buffer slds-table_striped">
                                    <thead>
                                        <tr class="slds-line-height_reset">
                                            <th scope="col" class="slds-text-heading_label">
                                                <div class="slds-truncate">Entity</div>
                                            </th>
                                            <th scope="col" class="slds-text-heading_label">
                                                <div class="slds-truncate">Total Count</div>
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={entityTotalsArray} for:item="totals">
                                            <tr key={totals.entity} class="slds-line-height_reset">
                                                <td data-label="Entity" scope="row">
                                                    <div class="slds-truncate">{totals.entity}</div>
                                                </td>
                                                <td data-label="Total Count" scope="row">
                                                    <div class="slds-truncate slds-text-align_right"><strong>{totals.totalCount}</strong></div>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>
                        </div>
                    </template>

                    <template if:false={naamJaapList}>
                        <p class="slds-text-align_center slds-text-body_regular">No records found.</p>
                    </template>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
