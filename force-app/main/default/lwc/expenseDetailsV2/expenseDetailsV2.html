<template>
    <div class="expense_container" style="height: 320px; overflow: scroll;">
        <lightning-accordion class="custom-accordion" allow-multiple-sections-open active-section-name=[]>
            <template for:each={accordionData} for:item="section">
                <lightning-accordion-section
                    key={section.category}
                    name={section.category}
                    label={section.category}>
                    <span slot="actions">
                        <lightning-formatted-number format-style="currency" currency-code="INR" value={section.totals} maximum-fraction-digits=0></lightning-formatted-number>
                    </span>
                    <c-expense-details-list record-list={section.records} onupdatedata={dataUpdateHandler}></c-expense-details-list>
                </lightning-accordion-section>
            </template>
        </lightning-accordion>
    </div>    
</template>
