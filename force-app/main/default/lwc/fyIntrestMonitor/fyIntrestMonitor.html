<template>
    <lightning-card>
        <div style="margin: 10px;">
            <!-- <lightning-combobox
                name="progress"
                label="Select FY"
                value={fyvalue}
                placeholder="Select Progress"
                options={fyOptions}
                onchange={handleChange}
                required
            ></lightning-combobox> -->
            <template if:true={errorMessage}>
                <span style="color: red; font-weight: bold;">{errorMessage}</span>
            </template>
            <template if:true={intrestList}>
                <table class="slds-table" style="margin: 5px;">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th class="" scope="col">
                                <div class="slds-truncate" title="Bank">Bank</div>
                            </th>
                            <th class="" scope="col">
                                <div class="slds-truncate" title="Interest">Interest</div>
                            </th>
                            <th class="" scope="col">
                                <div class="slds-truncate" title="More">More</div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={wrapperData} for:item="intr" for:index="index">
                            <tr key={intr.bank} class="slds-hint-parent">
                                <td data-label="Bank" scope="row">
                                    <div class="slds-truncate" title={intr.bank}>{intr.bank}</div>
                                </td>
                                <td data-label="Bank" scope="row">
                                    <div class="slds-truncate" title={intr.interest}>{intr.interest}</div>
                                </td>
                                <template if:true={intr.isShow}>
                                    <td data-label="Bank" scope="row">
                                        <div class="slds-truncate">
                                            <a href="javascript: void(0)" onclick={showMore} data-id={intr.bank}>Details</a>
                                            <!-- <a href="javascript: void(0)" onclick={showMore1} data-id={index}>Details</a> -->
                                        </div>
                                    </td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
            <template if:true={isShowModal}>
                <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" 
                aria-modal="true" aria-describedby="modal-content-id-1" 
                class="slds-modal slds-fade-in-open" style="max-width: 100% !important">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalBox}>
                                <lightning-icon icon-name="utility:close"
                                   alternative-text="close"
                                   variant="inverse"
                                   size="small" ></lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                             </button>
                             <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate"><b>Interest Details</b></h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                            <div style="height: 450px;">
                                <lightning-datatable
                                    key-field="accountNumber"
                                    data={recordList}
                                    show-row-number-column
                                    row-number-offset={rowOffset}
                                    hide-checkbox-column
                                    columns={columns}>
                                </lightning-datatable>
                            </div>
                        </div>
                        <div class="slds-modal__footer">
                            <lightning-layout horizontal-align="center">
                                <div class="custom-box slds-box margin-right slds-text-align_center">
                                    <lightning-layout-item padding="horizontal-small">
                                    <span><b>Accumulated</b></span>
                                    </lightning-layout-item>
                                    <lightning-layout-item>
                                        <span><b>&#8377;{totalAccumulated}</b></span>
                                    </lightning-layout-item>
                                </div>
                                <div class="custom-box slds-box margin-right slds-text-align_center">
                                    <lightning-layout-item padding="horizontal-small">
                                    <span><b>Paid</b></span>
                                    </lightning-layout-item>
                                    <lightning-layout-item>
                                        <span><b>&#8377;{totalPaid}</b></span>
                                    </lightning-layout-item>
                                </div>
                                <div class="custom-box slds-box margin-right slds-text-align_center">
                                    <lightning-layout-item padding="horizontal-small">
                                    <span><b>TDS</b></span>
                                    </lightning-layout-item>
                                    <lightning-layout-item>
                                        <span><b>&#8377;{totalTds}</b></span>
                                    </lightning-layout-item>
                                </div>
                            </lightning-layout>
                        </div>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
        </div>
    </lightning-card>
</template>
