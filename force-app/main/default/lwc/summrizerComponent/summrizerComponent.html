<template>
    <lightning-card>
        <div slot="actions">
            <lightning-button-icon
                icon-name={eyeIconName}
                alternative-text="Toggle visibility"
                onclick={handleToggleVisibility}
                class="slds-m-right_x-small">
            </lightning-button-icon>
        </div>
        
        <div slot="footer">
    
        </div>
        <p class="slds-p-horizontal_small">
            <template if:true={formattedTotal}>
                <table class="slds-table">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th class="" scope="col">
                                <div class="slds-truncate" title="Bank">Bank</div>
                            </th>
                            <th class="" scope="col">
                                <div class="slds-truncate" title="Deposite">Deposite</div>
                            </th>
                            <th class="" scope="col">
                                <div class="slds-truncate" title="Matured">Matured</div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={formattedTotal} for:item="total">
                            <tr key={total.type} class="slds-hint-parent">
                                <td data-label="Bank" scope="row">
                                    <div class="slds-truncate" title={total.type}>{total.type}</div>
                                </td>
                                <td data-label="Deposite">
                                    <div class="slds-truncate" title={total.displayDeposited}><b>{total.displayDeposited}</b></div>
                                </td>
                                <td data-label="Matured">
                                    <div class="slds-truncate" title={total.displayMatured}><b>{total.displayMatured}</b></div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
            <template if:true={errorMessge}>
                <span style="color: red;">{errorMessge}</span>
            </template>
       </p>
    </lightning-card>

    <!-- Password Modal -->
    <template if:true={isPasswordModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" 
                            title="Close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate">Enter Password</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input
                        type="password"
                        label="Password"
                        value={passwordInput}
                        onchange={handlePasswordChange}
                        onkeyup={handlePasswordKeyUp}
                        placeholder="Enter password">
                    </lightning-input>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button 
                        variant="neutral" 
                        label="Cancel" 
                        onclick={handleCloseModal}>
                    </lightning-button>
                    <lightning-button 
                        variant="brand" 
                        label="Submit" 
                        onclick={handlePasswordSubmit}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
