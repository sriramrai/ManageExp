<template>
  <template if:true={isOpen}>
    <section
      role="dialog"
      tabindex="-1"
      class="slds-modal slds-fade-in-open"
      aria-modal="true"
    >
      <div class="slds-modal__container">
        <!-- HEADER -->
        <header class="slds-modal__header">
          <button class="slds-button slds-modal__close" onclick={handleClose}>
            <lightning-icon
              icon-name="utility:close"
              alternative-text="Close"
              size="small"
            ></lightning-icon>
          </button>
          <h2 class="slds-text-heading_medium">{title}</h2>
        </header>

        <!-- BODY -->
        <div class="slds-modal__content slds-p-around_medium">
          <slot></slot>
          <!-- Render buttons in body if buttons array is provided -->
          <template if:true={buttons}>
            <div class="button-container">
              <template for:each={buttons} for:item="button">
                <lightning-button
                  key={button.label}
                  variant={button.variant}
                  label={button.label}
                  data-label={button.label}
                  onclick={handleButtonClick}
                  class="stacked-button"
                >
                </lightning-button>
              </template>
            </div>
          </template>
        </div>

        <!-- FOOTER -->
        <footer class="slds-modal__footer">
          <lightning-button
            variant="neutral"
            label="Close"
            onclick={handleClose}
          ></lightning-button>
        </footer>
      </div>
    </section>
    <div
      class="slds-backdrop slds-backdrop_open"
      onclick={handleBackdropClick}
    ></div>
  </template>
</template>
