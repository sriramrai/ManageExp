<template>
    <template if:true={stockData}>
        <div class="slds-card">
            <div class="slds-card__body slds-card__body_inner">
                <div class="slds-scrollable_y" style="max-height: 60vh;">
                    <table class="slds-table slds-table_bordered slds-table_fixed-layout slds-table_header-fixed custom-investments-table">
                        <thead>
                            <tr>
                                <th scope="col" class="col-name"><div class="slds-truncate" title="Stock Name">Stock Name</div></th>
                                <th scope="col" class="col-num"><div class="slds-truncate" title="Total Buyed">Total Buyed</div></th>
                                <th scope="col" class="col-num"><div class="slds-truncate" title="Total Sold">Total Sold</div></th>
                                <th scope="col" class="col-num"><div class="slds-truncate" title="Total Invested">Total Invested</div></th>
                                <th scope="col" class="col-actions"><div class="slds-truncate" title="Actions">Actions</div></th>
                            </tr>
                        </thead>
                        <tbody class="slds-hint-parent">
                            <template for:each={formattedStockData} for:item="stock">
                                <tr key={stock.recordId} class="slds-hint-parent">
                                    <td data-label="Stock Name" class="col-name slds-p-vertical_xx-small">
                                        <a href={stock.recordURL} target="_blank">{stock.stockName}</a>
                                    </td>
                                    <td data-label="Total Buyed" class="col-num slds-p-vertical_xx-small">
                                        {stock.totalBuyed}
                                    </td>
                                    <td data-label="Total Sold" class="col-num slds-p-vertical_xx-small">
                                        {stock.totalSold}
                                    </td>
                                    <td data-label="Total Invested" class="col-num slds-p-vertical_xx-small">
                                        {stock.totalInvested}
                                    </td>
                                    <td data-label="Actions" class="action-cell slds-p-vertical_xx-small">
                                        <!-- Single actions menu button -->
                                        <lightning-button-menu
                                            alternative-text="Actions"
                                            icon-name="utility:down"
                                            menu-alignment="auto"
                                            onselect={handleActionsMenuSelect}
                                            data-id={stock.recordId}>
                                            <span slot="trigger">
                                                <lightning-button variant="neutral" label="Actions" data-id={stock.recordId}></lightning-button>
                                            </span>
                                            <lightning-menu-item value="more" label="More"></lightning-menu-item>
                                            <lightning-menu-item value="buy" label="Buy"></lightning-menu-item>
                                            <lightning-menu-item value="sell" label="Sell"></lightning-menu-item>
                                        </lightning-button-menu>
                                    </td>
                                </tr>
                                <!-- Expanded details row - only rendered when expanded -->
                                <template if:true={stock.isExpanded}>
                                    <tr key={stock.expandedRowKey} data-stock-id={stock.recordId}>
                                        <td colspan="5" class="slds-p-vertical_xx-small">
                                            <div class="text-align-left">
                                                <template if:true={stock.lines}>
                                                    <div class="slds-p-around_x-small">
                                                        <div class="slds-grid slds-gutters slds-var-p-bottom_x-small slds-text-title_caps">
                                                            <div class="slds-col slds-size_1-of-4"><strong>Date</strong></div>
                                                            <div class="slds-col slds-size_1-of-4"><strong>Price/S</strong></div>
                                                            <div class="slds-col slds-size_1-of-6"><strong>Qty</strong></div>
                                                            <div class="slds-col slds-size_1-of-6"><strong>Amount</strong></div>
                                                            <div class="slds-col slds-size_1-of-6"><strong>Exec.</strong></div>
                                                        </div>
                                                        <template for:each={stock.lines} for:item="line">
                                                            <div key={line.recordId} class="slds-grid slds-gutters slds-var-p-vertical_xx-small">
                                                                <div class="slds-col slds-size_1-of-4">{line.sdate}</div>
                                                                <div class="slds-col slds-size_1-of-4">{line.pricePerShare}</div>
                                                                <div class="slds-col slds-size_1-of-6">{line.quantity}</div>
                                                                <div class="slds-col slds-size_1-of-6">{line.amount}</div>
                                                                <div class="slds-col slds-size_1-of-6">{line.buySell}</div>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>
</template>
