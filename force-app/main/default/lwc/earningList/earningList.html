<template>
    <lightning-card title="Earnings">
        <div slot="actions">
            <lightning-button-icon
                icon-name={eyeIconName}
                alternative-text="Toggle visibility"
                onclick={handleToggleVisibility}
                class="slds-m-right_x-small">
            </lightning-button-icon>
            <lightning-button label="New" onclick={createNew}></lightning-button>
        </div>

        <div class="">
            <div style="overflow: scroll; height: 120px; padding-left: 10px;">
            <template for:each={formattedEarningList} for:item="earning">
                <lightning-layout key={earning.Id}>
                    <lightning-layout-item padding="around-small" size="3">
                        <a href={earning.recordURL} target="_blank" onclick={navigateToPage}>{earning.Month__c}</a>
                    </lightning-layout-item>
                    <lightning-layout-item padding="around-small" size="4">
                        {earning.Credit_Date__c}
                    </lightning-layout-item>
                    <lightning-layout-item padding="around-small" size="4">
                        <template if:true={isValuesVisible}>
                            <b>
                                <lightning-formatted-number
                                    value={earning.Net_In_Hand__c}
                                    format-style="currency"
                                    currency-code="INR"
                                    minimum-fraction-digits="0"
                                    maximum-fraction-digits="0">
                                </lightning-formatted-number>
                            </b>
                        </template>
                        <template if:false={isValuesVisible}>
                            <b>****</b>
                        </template>
                    </lightning-layout-item>
                </lightning-layout>
            </template>
            </div>
        </div>
    </lightning-card>

    <!-- Password Modal -->
    <template if:true={isPasswordModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" 
                            title="Close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate">Enter Password</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input
                        type="password"
                        label="Password"
                        value={passwordInput}
                        onchange={handlePasswordChange}
                        onkeyup={handlePasswordKeyUp}
                        placeholder="Enter password">
                    </lightning-input>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button 
                        variant="neutral" 
                        label="Cancel" 
                        onclick={handleCloseModal}>
                    </lightning-button>
                    <lightning-button 
                        variant="brand" 
                        label="Submit" 
                        onclick={handlePasswordSubmit}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
