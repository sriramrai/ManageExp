<template>
  <!-- <c-navigation-header landing-page="Declaration"></c-navigation-header> -->
  <lightning-card title="Declaration">
    <div slot="actions">
      <lightning-button-icon
        icon-name={eyeIconName}
        alternative-text="Toggle visibility"
        onclick={handleToggleVisibility}
        class="slds-m-right_x-small"
      >
      </lightning-button-icon>
      <lightning-button
        label={actionLabel}
        onclick={declareIncome}
      ></lightning-button>
    </div>
    <div class="slds-p-horizontal_small">
      <div class="scrollable-div">
        <template if:true={enableCreate}>
          <lightning-record-edit-form
            object-api-name="Income__c"
            record-id={recordId}
            onsuccess={saveSucceeded}
          >
            <template for:each={fieldList} for:item="currentItem">
              <lightning-input-field
                key={currentItem.key}
                field-name={currentItem.name}
                disabled={currentItem.disabled}
                value={currentItem.value}
              ></lightning-input-field>
            </template>

            <div class="slds-var-m-top_medium align-center">
              <lightning-button
                class="padding-around"
                variant="brand"
                type="submit"
                label="Save"
              >
              </lightning-button>
              <lightning-button
                class="padding-around"
                variant="neutral"
                label="cancel"
                onclick={handleCancel}
              >
              </lightning-button>
            </div>
          </lightning-record-edit-form>
        </template>

        <template if:true={data}>
          <lightning-layout multiple-rows="true">
            <lightning-layout-item size="6" padding="around-small">
              <lightning-input
                label="Start Date"
                value={data.Start_Date__c}
                disabled="true"
              ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="6" padding="around-small">
              <lightning-input
                label="End Date"
                value={data.End_Date__c}
                disabled="true"
              ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="6" padding="around-small">
              <template if:true={isValuesVisible}>
                <lightning-input
                  label="Salary"
                  value={data.Salary__c}
                  disabled="true"
                ></lightning-input>
              </template>
              <template if:false={isValuesVisible}>
                <lightning-input
                  label="Salary"
                  value="****"
                  disabled="true"
                ></lightning-input>
              </template>
            </lightning-layout-item>
            <lightning-layout-item size="6" padding="around-small">
              <template if:true={isValuesVisible}>
                <lightning-input
                  label="Other"
                  value={data.Other__c}
                  disabled="true"
                ></lightning-input>
              </template>
              <template if:false={isValuesVisible}>
                <lightning-input
                  label="Other"
                  value="****"
                  disabled="true"
                ></lightning-input>
              </template>
            </lightning-layout-item>
            <lightning-layout-item size="6" padding="around-small">
              <template if:true={isValuesVisible}>
                <lightning-input
                  label="FD Interest"
                  disabled="true"
                  value={incomeFromIntrest}
                ></lightning-input>
              </template>
              <template if:false={isValuesVisible}>
                <lightning-input
                  label="FD Interest"
                  disabled="true"
                  value="****"
                ></lightning-input>
              </template>
            </lightning-layout-item>
            <lightning-layout-item size="6" padding="around-small">
              <template if:true={isValuesVisible}>
                <lightning-input
                  class="textInput"
                  label="Total"
                  disabled="true"
                  value={totalIncome}
                ></lightning-input>
              </template>
              <template if:false={isValuesVisible}>
                <lightning-input
                  class="textInput"
                  label="Total"
                  disabled="true"
                  value="****"
                ></lightning-input>
              </template>
            </lightning-layout-item>
          </lightning-layout>
        </template>
      </div>
    </div>
  </lightning-card>

  <!-- Password Modal -->
  <template if:true={isPasswordModalOpen}>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <button
            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
            title="Close"
            onclick={handleCloseModal}
          >
            <lightning-icon
              icon-name="utility:close"
              alternative-text="close"
              size="small"
            ></lightning-icon>
            <span class="slds-assistive-text">Close</span>
          </button>
          <h2 class="slds-modal__title slds-hyphenate">Enter Password</h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <lightning-input
            type="password"
            label="Password"
            value={passwordInput}
            onchange={handlePasswordChange}
            onkeyup={handlePasswordKeyUp}
            placeholder="Enter password"
          >
          </lightning-input>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button
            variant="neutral"
            label="Cancel"
            onclick={handleCloseModal}
          >
          </lightning-button>
          <lightning-button
            variant="brand"
            label="Submit"
            onclick={handlePasswordSubmit}
          >
          </lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
